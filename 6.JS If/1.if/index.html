<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS If </title>
</head>

<body>
    <h1>JS If </h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam quo incidunt optio.</p>
    <p class="root">Not  a Good day</p>

    <script>
        if (new Date() .getHours() < 24) {
            document.querySelector(".root")
                .innerHTML = "Have a God day";
        }

    </script>
</body>

</html>
