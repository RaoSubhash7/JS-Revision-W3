<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If-Else Statement</title>
</head>
<body>
    <h2>If-Else Statement</h2>
    <p class="root"></p>
    <script>
        let age = prompt("Enter your age");
        if (age >= 18){
            document.querySelector(".root")
            .innerHTML = "You are eligible to Vote";
        }
        else {
        document.querySelector(".root")
        .innerHTML = "You are not eligible to vote";
        }
    </script>

</body>
</html>
