<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>else if</title>
</head>
<body>
    <h2>Else if Statement</h2>else if
    <p class="root" ></p>
    <script>
        let time = 4;
        if (time <10 ){
        document.querySelector(".root").innerHTML = "Good morning";
        }else if (time <20){
            document.querySelector(".root").innerHTML = "Good day";
        }else {
            document.querySelector(".root").innerHTML = "Good evening"
        }
    </script>
</body>
</html>
