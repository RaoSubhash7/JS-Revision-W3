<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript in Head</title>

    <script  >
    document.addEventListener("DOMContentLoaded",()=>{
    const root = document.querySelector(".root");
    const button = document.querySelector("button");

    button.addEventListener("click",()=>{
      root.innerText="Subhash  tum  click kr diya hai"
    });
 })
    </script>
</head>
<body>
    <h2>JavaScript in Head </h2>
    <p class="root">Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum amet, qui veniam consequatur laudantium molestias.</p>
    <button type="button" >Click Me</button>
</body>
</html>
