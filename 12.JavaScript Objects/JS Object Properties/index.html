<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Object Properties</h1>
<h2>Property Access Using Brackets []</h2>

<p id="demo"></p>

<script>
const person = {
  firstName: "John",
  lastName : "Doe",
  age      :  50
};

let n1 = "firstName";
let n2 = "lastName";
let name = person[n1] + " " + person[n2]; 

document.getElementById("demo").innerHTML = name; 
</script>

</body>
</html>
