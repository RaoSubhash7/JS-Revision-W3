<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Objects</h1>
<p>An object method is a function definition stored as a property value.</p>
<p>In an object method, <b>this</b> refers to the object.</p>

<p id="demo"></p>

<script>
// Create an Object
const person = {
  firstName: "John",
  lastName: "Doe",
  id: 5566,
  getId: function() {
    return this.id;
  }
};

let number = person.getId();

document.getElementById("demo").innerHTML = "The number is " + number;
</script>
</body>
</html>
