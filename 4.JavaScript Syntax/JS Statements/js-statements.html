<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Statements</title>
</head>
<body>
    <h2>JavaScript Statements</h2>
    <p class="test" ></p>
    <script>
        let x ,y, z;  //statement 1
        x=4;          //statement 2
        y=7;          //statement 3
        z=45;         //statement 4
        sum=x+y+z;    //statement 5
        document.querySelector(".test")
        .innerHTML = "Total Sum is " + sum
    </script>
</body>
</html>
