<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Syntax</title>
</head>
<body>
    
    <p>The = operator is used to assign values to variables.</p>
    
    <p id="demo"></p>
    
    <script>
        let x = 5;
        let y = 6;
        let sum = x + y;
        
        document.getElementById("demo").innerHTML = "The sum is " + sum;
        //javascript is case sensitive . Here is a Let and let are in  the JavaScript identifiers are case sensitive 
        //JavaScript programmers tend to use lower camel case.
        //firstName, lastName, masterCard, interCity.


</script>
</body>
</html>
